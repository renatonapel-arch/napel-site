server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;   # atrás do Traefik: Location relativo, senão o 301 sai como http://

    # HTML/JS/JSON: navegador sempre confere se há versão nova (304 se igual)
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache";
    }
    # artigos: URL antiga post.html?slug=X -> página fixa /blog/X.html (301 preserva o ranking)
    location = /post.html {
        add_header Cache-Control "no-cache";
        if ($arg_slug) { return 301 /blog/$arg_slug.html; }
    }
    # página de LEM do site antigo (WordPress) que o Google ainda indexa
    location ~ ^/luis-eduardo-magalhaes-ba-copy/?$ { return 301 /luis-eduardo-magalhaes-ba/; }
    # ---- endereços do WordPress antigo (antes de 23/06/2026) que o Google ainda visita ----
    location ~ ^/index\.php$ { return 301 /; }
    location ~ ^/sp/maringa[^/]*/?$ { return 301 /maringa-pr/; }
    location ~ ^/sp/ponta-grossa[^/]*/?$ { return 301 /ponta-grossa-pr/; }
    location ~ ^/sp/luis-eduardo-magalhaes[^/]*/?$ { return 301 /luis-eduardo-magalhaes-ba/; }
    location ~ ^/(quem-somos|sobre)/?$ { return 301 /#sobre; }
    location ~ ^/(contato|contacto)/?$ { return 301 /#contato; }
    location ~ ^/(produtos|loja|suspensao|freios)/?$ { return 301 /#produtos; }
    location ~ ^/blog/?$ { return 301 /blog.html; }
    # tag/categoria/feed/carrinho do WordPress: não existem mais (410 = removido de vez; o Google para de tentar)
    location ~ ^/(tag|category|author|wp-content|wp-includes|wp-json|carrinho|finalizar-compra|minha-conta)(/|$) { return 410; }
    location ~ /feed/?$ { return 410; }
    # artigo antigo /<slug>/ -> /blog/<slug>.html, só se o artigo existe no site novo
    location ~ ^/([a-z0-9-]+)/?$ {
        if (-f $document_root/blog/$1.html) { return 301 /blog/$1.html; }
        try_files $uri $uri/ =404;
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}
