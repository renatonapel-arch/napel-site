server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # HTML/JS/JSON: navegador sempre confere se há versão nova (304 se igual)
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache";
    }
    # artigos: URL antiga post.html?slug=X -> página fixa /blog/X.html (301 preserva o ranking)
    location = /post.html {
        add_header Cache-Control "no-cache";
        if ($arg_slug) { return 301 /blog/$arg_slug.html; }
    }
    # página de LEM do site antigo (WordPress) que o Google ainda indexa
    location ~ ^/luis-eduardo-magalhaes-ba-copy/?$ { return 301 /luis-eduardo-magalhaes-ba/; }
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}
