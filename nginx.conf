server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # HTML/JS/JSON: navegador sempre confere se há versão nova (304 se igual)
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache";
    }
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}
